<!-- Park the headline lines below their masks before the first paint;
     if main.js has not booted in 4s, give the headings back. -->
<script>
  document.documentElement.classList.add("reveal-ready");
  setTimeout(function () {
    if (!document.documentElement.dataset.ready) {
      document.documentElement.classList.remove("reveal-ready");
    }
  }, 4000);
</script>
