<!-- ==========================================================================
     GRAPHICS — copy-paste markup for the three animated figures
     Milton Winroth portfolio · assets/css/components/graphics.css

     This file is a fragment, not a page. Each block below is the complete
     markup for one figure, with a comment above it saying where it goes.
     docs/graphics-preview.html loads this file and renders every block on
     both grounds and at both breakpoints — that is the harness these were
     verified in, and it stays honest because it renders this exact source.

     ----------------------------------------------------------------------
     INTEGRATION — three steps, all outside my files
     ----------------------------------------------------------------------

     1. assets/css/main.css — add the import. Position matters only in that it
        must sit with the other components:

            @import url("components/graphics.css");

        Put it after components/scenes.css. No JS import: there is no
        graphics.js. Everything is driven by scene.js and parallax.js, which
        already run.

     2. Drop a block in. Each figure is a <figure class="gfx …"> that replaces
        a .media/.media__placeholder pair outright — it brings its own frame,
        radius, clip and ground-aware background. Do not nest it inside .media.

     3. Wire up progress. Two cases:

        a) The figure scrolls past (problem rows, any normal column).
           Leave data-scene="cover" data-scene-ease on the <figure>. It gets
           its own 0→1 as it crosses the viewport. Nothing else to do.

        b) The figure is held sticky (.split__hold, in Capabilities and AI).
           A sticky element barely moves, so its own progress would freeze.
           REMOVE data-scene and data-scene-ease from the <figure> and put
           them on the .split wrapper instead:

               <div class="split" data-scene data-scene-ease>

           The split is taller than the viewport, so the default "pin" mode
           applies and progress tracks the scroll through the section. The
           figure inherits --progress from it — scene.js sets the property on
           the scene element and descendants read it.

        Never both. An inner data-scene shadows the outer one.

     ----------------------------------------------------------------------
     TOKEN RECOMMENDATIONS — not applied, tokens.css is not mine
     ----------------------------------------------------------------------

     graphics.css introduces no raw colour, spacing, radius, duration or
     easing. It derives its drawing weights from tokens that already flip with
     [data-ground]:

         --gfx-accent      rgb(var(--particle-accent))          ground-aware
         --gfx-a-line      calc(var(--particle-dot-alpha)   * 0.5)
         --gfx-a-plate     calc(var(--particle-grid-alpha)  * 1.5)
         --gfx-a-label     calc(var(--particle-dot-alpha)   * 1.5)
         --gfx-a-guide     var(--particle-guide-alpha)

     That works and it inherits correctly, but it does mean the figures are
     tuned by moving the canvas. Two suggestions, both optional:

     1. Promote a ground-aware accent. --c-accent is a fixed cobalt and reads
        heavy on near-black, which is why --particle-accent lightens to
        #5C6EFF there. That distinction deserves its own name rather than
        living inside the canvas block:

            --accent-vivid: var(--c-cobalt);            /* :root       */
            --accent-vivid: #5C6EFF;                    /* dark ground */

        Then graphics.css sets --gfx-accent: var(--accent-vivid) and the
        canvas can keep its channel form for rgba() composition.

     2. Promote the four drawing alphas as --gfx-a-* alongside the
        --particle-*-alpha block, so a figure can be re-weighted without
        touching the particle field. The multipliers above are the values I
        landed on; they can be pasted in directly.

     Neither blocks anything. The figures are correct as they stand.
     ========================================================================== -->
