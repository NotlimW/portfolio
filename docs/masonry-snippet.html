     CREATIVE WALL — copy-paste block
     ==========================================================================

         </section>          <-- currently ends around line 301

     …and before the "Twenty versions. One that wins." statement scene.
     The case makes the argument, the wall is the evidence, the statement is
     the punchline. Putting it after the statement instead also works, but then
     it sits between the punchline and the systems case and blunts both.

     Ground rhythm: the work section above is dark and the wall is dark too, so
     the seam is invisible and the grid reads as the same breath as the case.
     The light statement scene below still gives the eye its break.


     THE TWO WIRING LINES (both in files I don't own)
     -----------------------------------------------
     1. assets/css/main.css — add after the scenes import:

            @import url("components/masonry.css");

        Order isn't load-bearing: masonry.css shares no selector with any
        other component. Grouping it with the other components is enough.

     2. assets/js/main.js — one import and one entry in the module list:

            import * as masonry from "./modules/masonry.js";

        …and add `masonry,` to the `modules` array, anywhere after
        `smoothScroll` (it subscribes to that loop). Next to `parallax` is the
        natural home.

     WHY A MODULE AND NOT JUST data-parallax / data-scene
     ----------------------------------------------------
     The wall would work with `data-scene="cover" data-parallax="0.1"` on every
     item and no new JavaScript at all — masonry.css falls back to scene.js's
     --progress on purpose, so if you'd rather not add a module, swap
     `data-plane` for `data-scene="cover"` and it still runs.

     It costs about six times more per frame. Both existing modules call
     getBoundingClientRect per element and write between reads, so 32 items
     become ~96 measurements and 32 interleaved writes — every write
     invalidating the next read. masonry.js measures each item's offset once,
     then reads one rect per frame for the whole grid and does the rest as
     arithmetic, writing in a second pass. Measured below.


     IMAGES
     ------
     Every item is `.creative-wall__media` wrapping one child. Right now that
     child is the standard `.media__placeholder`. When assets/media/ is
     populated, replace the placeholder div with a <picture> and nothing else
     changes — the frame, ratio, drift, focus and clipping all stay put:

         <div class="creative-wall__media">
           <picture>
             <source srcset="assets/media/wall/01.avif" type="image/avif">
             <source srcset="assets/media/wall/01.webp" type="image/webp">
             <img src="assets/media/wall/01.jpg"
                  alt="Meta feed ad for a nutrition brand — split screen,
                       before and after, headline set in condensed caps"
                  width="1080" height="1350" loading="lazy" decoding="async">
           </picture>
         </div>

     alt text: describe the creative, not the format. "Meta 4:5" is already in
     the file name and tells a screen reader nothing. The `--ratio` on the item
     must match the asset's real aspect ratio, or the crop will lie.

     If data/media-manifest.json lands with a per-item aspect ratio, the only
     thing worth generating from it is the `--ratio` and the `alt` — leave the
     `--speed` wave alone, see below.


     THE SPEED WAVE — don't shuffle it
     ---------------------------------
     Multi-column fills columns in document order, so two frames stacked in the
     same column are always neighbours in this markup. `--speed` therefore runs
     as a slow wave along the list (0.05 → 0.18 → 0.05 …) where neighbours
     differ by at most 0.03. That bounds how much two stacked frames can close
     on each other to a few pixels — always less than the gap. Across the wall
     you still read the full spread, because it's the columns you compare, not
     the frames inside one.

     Randomising the speeds, or sorting the items by anything, breaks that and
     the frames start to touch. If you add items, continue the wave.


     RECOMMENDED TOKENS (not added — tokens.css isn't mine to edit)
     -------------------------------------------------------------
     Everything here uses existing tokens except the motion amplitudes, which
     live as named --masonry-* properties at the top of masonry.css, the same
     way scenes.css keeps its own. If you'd rather they were global, these are
     the three worth promoting, because a second gallery would want the same:

         --plane-drift: 110px;   travel at speed 1 across one full crossing
         --plane-band:  2.1;     how wide the in-focus band is, >1
         --plane-blur:  5px;     defocus radius cap, desktop only

     ========================================================================== -->
